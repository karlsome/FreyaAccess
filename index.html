<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freya Access - Universal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <!-- Logo Section -->
    <div class="text-center mb-8">
      <div class="mb-4">
        <img src="src/logo.png" alt="Freya Logo" class="mx-auto h-20" onerror="this.style.display='none'" />
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Freya Access</h1>
      <p class="text-gray-600">Universal Authentication Portal</p>
      <p class="text-sm text-gray-500 mt-1">Login to access your company dashboard</p>
    </div>
    
    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <i class="ri-user-line mr-1"></i>Username
        </label>
        <input 
          type="text" 
          id="username" 
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" 
          placeholder="Enter your username" 
          required 
          autocomplete="username"
        />
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <i class="ri-lock-line mr-1"></i>Password
        </label>
        <input 
          type="password" 
          id="password" 
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" 
          placeholder="Enter your password" 
          required
          autocomplete="current-password"
        />
      </div>
      
      <button 
        type="submit" 
        id="loginBtn"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200 shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
      >
        <i class="ri-login-box-line"></i>
        <span id="loginBtnText">Login</span>
      </button>
      
      <p id="loginError" class="text-red-600 text-sm text-center hidden bg-red-50 p-3 rounded-lg">
        <i class="ri-error-warning-line mr-1"></i>
        <span id="errorText"></span>
      </p>
      
      <p id="loginStatus" class="text-blue-600 text-sm text-center hidden bg-blue-50 p-3 rounded-lg">
        <i class="ri-loader-4-line animate-spin mr-1"></i>
        <span id="statusText">Authenticating...</span>
      </p>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center text-xs text-gray-500">
      <p>Secure authentication powered by Freya Access</p>
      <p class="mt-1">© 2025 Freya Systems. All rights reserved.</p>
    </div>
  </div>

  <script>
    //const API_BASE = 'https://kurachi.onrender.com';
    const API_BASE = 'http://localhost:3000'; // Uncomment for local development

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      const statusEl = document.getElementById('loginStatus');
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const errorText = document.getElementById('errorText');
      const statusText = document.getElementById('statusText');
      
      // Hide previous messages
      errorEl.classList.add('hidden');
      statusEl.classList.remove('hidden');
      loginBtn.disabled = true;
      loginBtn.classList.add('opacity-50', 'cursor-not-allowed');
      loginBtnText.textContent = 'Authenticating...';
      
      try {
        console.log('Attempting login for:', username);
        
        const response = await fetch(`${API_BASE}/loginCustomer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: 'Invalid credentials' }));
          throw new Error(errorData.error || 'Authentication failed');
        }
        
        const data = await response.json();
        console.log('Login successful:', data);
        
        // Extract user info
        const token = data.token || data.authToken;
        const user = data.user || data;
        const company = user.company || user.dbName;
        
        if (!token || !company) {
          throw new Error('Invalid response from server: missing token or company');
        }
        
        // Generate subdomain from company name
        const subdomain = companyToSubdomain(company);
        console.log('Redirecting to:', subdomain);
        
        // Update status
        statusText.textContent = `Redirecting to ${company}...`;
        
        // Build redirect URL - determine which app based on company
        let redirectUrl;
        if (company.toLowerCase() === 'ksg') {
          redirectUrl = `https://ksg.freyaaccess.com?token=${encodeURIComponent(token)}`;
        } else {
          // Default to database management app
          redirectUrl = `https://${subdomain}.freyaaccess.com?token=${encodeURIComponent(token)}`;
        }
        
        // Redirect after short delay
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 800);
        
      } catch (error) {
        console.error('Login error:', error);
        errorText.textContent = error.message || 'Login failed. Please try again.';
        errorEl.classList.remove('hidden');
        statusEl.classList.add('hidden');
        loginBtn.disabled = false;
        loginBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        loginBtnText.textContent = 'Login';
      }
    });

    function companyToSubdomain(company) {
      // Convert company name to valid subdomain
      // "KSG" → "ksg"
      // "Sasaki Coating" → "sasaki-coating"
      return company
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    // Auto-focus username field
    document.getElementById('username').focus();
  </script>
</body>
</html>
